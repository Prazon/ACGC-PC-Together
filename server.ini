; Animal Crossing dedicated-town host configuration
; Stop the server before changing this file. Command-line options override it.

[server]
port = 24680
capacity = 4
tick_rate = 60
snapshot_rate = 15
connection_timeout_ms = 30000
build_id = 0
dashboard = true

[town]
town_id = 1
town_name = "NetTown"
; Keep this stable: it deterministically selects the original town layout.
town_seed = 1

[clock]
timezone = "UTC"
utc_offset_minutes = 0
clock_mode = realtime
clock_scale = 1
; Continuously match the host system clock. Overrides clock_mode,
; clock_scale, starting_datetime, and any administrative time change.
sync_to_system_clock = false
; Used only for a new town. Remove the leading ';' to set it.
; starting_datetime = "2026-08-06 09:00:00"
allow_time_travel = false
empty_town_simulation = scheduled

[storage]
data_directory = "/tmp/claude-1000/-mnt-b-ACGC-PC-Port-master/96fc0973-6cd0-4d12-a443-76ca8384fee1/scratchpad/pty-town"

[security]
invite_required = true
; Keep this private. It may instead be supplied via ACGC_INVITE_KEY.
invite_key = ""
